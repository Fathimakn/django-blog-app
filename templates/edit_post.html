{% extends 'master.html' %}

{% block title %}
<title>Update Posts</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }

  .nav {
    text-align: right;
    margin: 10px;
  }

  .nav a {
    text-decoration: none;
    color: #fff;
    background: #007BFF;
    padding: 6px 12px;
    border-radius: 4px;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }

  form {
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ccc;
    background: #f2f2f2;
    border-radius: 8px;
  }

  form p {
    margin-bottom: 12px;
  }

  form input,
  form select,
  form textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
    border-radius: 4px;
    border: 1px solid #aaa;
  }

  form button {
    background: green;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
{% endblock %}

{% block content %}


<div class="nav">
  <a href="{% url 'home' %}">Home</a>
  <a href="{% url 'logout' %}">Logout</a>
</div>

<h1>Update Your Posts</h1>

<form method="post" >
  {% csrf_token %}
   {{ form.as_p }}
  <button type="submit">Edit</button>
</form>
{% endblock %}
